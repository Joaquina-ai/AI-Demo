plugins {
    id 'com.android.application'
}

android {
    namespace 'com.childusage.tracker'
    compileSdk 34

    defaultConfig {
        applicationId "com.childusage.tracker"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // Server URL — override via gradle property or BuildConfig
        buildConfigField "String", "SERVER_URL", "\"${project.findProperty('SERVER_URL') ?: 'http://10.0.2.2:3000'}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
